server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 40960m;

    # Docker's embedded DNS (127.0.0.11) is authoritative for the "backend"
    # service name. Without this, nginx resolves it once when this worker
    # starts and keeps using that IP for the worker's lifetime -- fine until
    # `update.sh`/`install.sh` rebuild and recreate the backend container
    # (a new container gets a new internal IP) without also recreating this
    # frontend container (its own image is often unchanged, so compose
    # leaves it running). Every /api/ request then 502s against a backend
    # IP that no longer exists, which is exactly what login looked like
    # after an update: not a credentials problem, nginx never reaching the
    # backend at all. A variable in proxy_pass forces per-request
    # resolution through `resolver` instead of a one-time lookup.
    resolver 127.0.0.11 valid=10s;

    location /api/ {
        # No URI after the variable -- with a variable, proxy_pass no
        # longer does its usual "replace the matched location prefix"
        # rewrite (verified: it would silently truncate every request to
        # just "/api/", dropping the rest of the path). Passing the bare
        # address instead forwards the original request URI unchanged,
        # which is what the backend (routes registered under /api/...)
        # expects -- matches the old static proxy_pass's behavior exactly.
        set $backend_upstream http://backend:8000;
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # nginx's stock mime.types doesn't map .mjs, so it falls back to
    # application/octet-stream -- browsers refuse to load that as an ES
    # module (e.g. pdf.js's worker), failing with "Failed to fetch
    # dynamically imported module" even though the file loads fine.
    # default_type only kicks in when mime.types has no match, so this
    # can't shadow any other extension's real type.
    location ~ \.mjs$ {
        default_type application/javascript;
        try_files $uri =404;
    }

    location / {
        try_files $uri /index.html;
    }
}
