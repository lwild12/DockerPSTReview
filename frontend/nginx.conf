server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 4096m;

    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # nginx's stock mime.types doesn't map .mjs, so it falls back to
    # application/octet-stream -- browsers refuse to load that as an ES
    # module (e.g. pdf.js's worker), failing with "Failed to fetch
    # dynamically imported module" even though the file loads fine.
    # default_type only kicks in when mime.types has no match, so this
    # can't shadow any other extension's real type.
    location ~ \.mjs$ {
        default_type application/javascript;
        try_files $uri =404;
    }

    location / {
        try_files $uri /index.html;
    }
}
